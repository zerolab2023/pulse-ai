<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단지매치 — 우리 단지 갈아타기</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#191f28; --sub:#6b7684; --line:#e5e8eb;
    --brand:#3182f6; --brand-dark:#1b64da; --brand-soft:#e8f3ff;
    --good:#00a05e; --good-soft:#e5f6ee; --warn:#d9730d; --warn-soft:#fdf0e3;
    --danger:#e5484d; --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#e9edf2; color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    display:flex;justify-content:center;
  }
  #frame{
    width:100%;max-width:430px;min-height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.08);
  }
  #view{flex:1;overflow-y:auto;padding-bottom:84px}
  /* ---------- common ---------- */
  .page{padding:20px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(25,31,40,.04)}
  .card h3{font-size:15px;margin-bottom:12px}
  h1{font-size:24px;line-height:1.35;letter-spacing:-.3px}
  h2{font-size:18px;letter-spacing:-.2px}
  .sub{color:var(--sub);font-size:13px;line-height:1.6}
  .btn{
    display:block;width:100%;padding:16px;border:0;border-radius:14px;
    background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
    text-align:center;text-decoration:none;transition:transform .05s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.soft{background:var(--brand-soft);color:var(--brand-dark)}
  .btn.danger-ghost{background:var(--card);color:var(--danger);border:1px solid var(--line)}
  .btn:disabled{background:#c9d2dc;cursor:not-allowed}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .chip{
    display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;user-select:none;
  }
  .chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  .field label{font-size:13px;font-weight:700;color:var(--sub)}
  .field input,.field select{
    padding:14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:var(--card);
    font-family:inherit;width:100%;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--brand);border-color:transparent}
  .badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700}
  .badge.blue{background:var(--brand-soft);color:var(--brand-dark)}
  .badge.green{background:var(--good-soft);color:var(--good)}
  .badge.orange{background:var(--warn-soft);color:var(--warn)}
  .divider{height:1px;background:var(--line);margin:4px 0}
  .money-table{width:100%;font-size:14px;border-collapse:collapse}
  .money-table td{padding:7px 0}
  .money-table td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .money-table tr.total td{border-top:1px solid var(--line);padding-top:12px;font-size:15px}
  .money-table .plus{color:var(--danger)} .money-table .minus{color:var(--brand)}
  .info-dot{
    display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
    border-radius:50%;background:var(--line);color:var(--sub);font-size:11px;font-weight:700;
    cursor:pointer;vertical-align:2px;margin-left:4px;
  }
  /* ---------- header ---------- */
  .appbar{
    position:sticky;top:0;z-index:10;background:rgba(244,246,249,.92);backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:8px;padding:14px 16px;min-height:56px;
  }
  .appbar .back{border:0;background:none;font-size:22px;cursor:pointer;line-height:1;padding:4px;color:var(--ink)}
  .appbar .title{font-size:17px;font-weight:800;letter-spacing:-.2px}
  /* ---------- tabbar ---------- */
  #tabbar{
    position:absolute;bottom:0;left:0;right:0;height:76px;background:var(--card);
    border-top:1px solid var(--line);display:flex;z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #tabbar a{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-decoration:none;color:#8b95a1;font-size:11px;font-weight:600;
  }
  #tabbar a.on{color:var(--brand)}
  #tabbar .ico{font-size:21px;line-height:1}
  /* ---------- landing ---------- */
  .hero{padding:44px 24px 28px;background:linear-gradient(160deg,#eaf3ff 0%,#f4f6f9 70%)}
  .hero .logo{font-size:14px;font-weight:900;color:var(--brand);letter-spacing:-.2px;margin-bottom:18px}
  .demand{display:flex;flex-direction:column;gap:8px}
  .demand-row{
    display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border-radius:12px;padding:13px 16px;font-size:14px;font-weight:600;
  }
  .demand-row b{color:var(--brand);font-variant-numeric:tabular-nums}
  .howto{display:flex;flex-direction:column;gap:12px}
  .howto .step{display:flex;gap:12px;align-items:flex-start}
  .howto .n{
    flex:0 0 26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  }
  .howto p{font-size:14px;line-height:1.55}
  .howto p b{display:block}
  /* ---------- stepper ---------- */
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
  .steps i.on{background:var(--brand)}
  .spinner{
    width:44px;height:44px;border-radius:50%;border:4px solid var(--brand-soft);
    border-top-color:var(--brand);animation:spin 1s linear infinite;margin:0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .check-big{
    width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good);
    display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto;
  }
  /* ---------- gauge ---------- */
  .gauge{background:var(--line);height:8px;border-radius:4px;overflow:hidden}
  .gauge>i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
  /* ---------- match ---------- */
  .countdown{
    display:flex;align-items:center;justify-content:center;gap:8px;background:#fff4f4;
    border:1px solid #ffe0e0;color:var(--danger);border-radius:12px;padding:12px;
    font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;
  }
  .photo{
    aspect-ratio:4/3;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:14px;letter-spacing:-.2px;
    background:linear-gradient(135deg,#8fb8ff,#3d6fd8);
  }
  .photo.small{aspect-ratio:1/1;font-size:11px;border-radius:10px}
  .score-pill{
    display:inline-flex;align-items:center;gap:4px;background:var(--good-soft);color:var(--good);
    font-weight:800;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;
  }
  .score-detail{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .score-detail .bar-row{display:grid;grid-template-columns:64px 1fr 34px;gap:10px;align-items:center;font-size:12px;color:var(--sub)}
  .bar-row .gauge{height:6px}
  /* timeline */
  .timeline{display:flex;flex-direction:column}
  .tl{display:flex;gap:14px;position:relative;padding-bottom:22px}
  .tl:last-child{padding-bottom:0}
  .tl::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
  .tl:last-child::before{display:none}
  .tl .dot{
    flex:0 0 24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;z-index:1;
  }
  .tl.done .dot{background:var(--good);border-color:var(--good);color:#fff}
  .tl.now .dot{border-color:var(--brand);background:var(--brand-soft)}
  .tl .t{font-size:14px;font-weight:700}
  .tl.now .t{color:var(--brand-dark)}
  .tl .d{font-size:12px;color:var(--sub);margin-top:2px}
  /* misc */
  .list-item{
    display:flex;justify-content:space-between;align-items:center;padding:16px 0;
    border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);
  }
  .list-item:last-child{border-bottom:0}
  .noti{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .noti:last-child{border-bottom:0}
  .noti .ic{flex:0 0 38px;height:38px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:17px}
  .noti .b{font-size:14px;font-weight:600;line-height:1.45}
  .noti .d{font-size:12px;color:var(--sub);margin-top:2px}
  .tabs{display:flex;background:var(--line);border-radius:12px;padding:4px}
  .tabs button{
    flex:1;padding:10px;border:0;border-radius:9px;background:none;font-size:13px;font-weight:700;
    color:var(--sub);cursor:pointer;font-family:inherit;
  }
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .weights li{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px;font-weight:600;list-style:none;
  }
  .weights .rank{color:var(--brand);font-weight:800;width:18px}
  .weights .mv{margin-left:auto;display:flex;gap:6px}
  .weights .mv button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:13px}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:rgba(25,31,40,.92);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;
    z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1}
  /* demo switcher */
  #demo{
    position:absolute;top:8px;right:8px;z-index:50;font-size:11px;
  }
  #demo select{
    font-size:11px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.9);color:var(--sub);font-family:inherit;
  }
  .empty{padding:48px 0;text-align:center;color:var(--sub);font-size:14px}
  .banner{
    display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);
    border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;
  }
</style>

<div id="frame">
  <div id="demo" title="프로토타입 데모용 상태 전환"></div>
  <div id="view"></div>
  <nav id="tabbar"></nav>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =====================================================================
   단지매치 — P0 클릭 프로토타입 (의존성 0)
   추후 Next.js 포팅 전제: 화면/상태 구조는 docs/07 기획서와 1:1 대응
===================================================================== */

/* ---------- mock data ---------- */
const COMPLEX = {
  name: "한강푸른마을", dongs: [101,102,103,104,105,106,107],
  types: ["59A","59B","84A","84B","109A"],
  demand: [
    {from:"84타입", to:"109타입", n:12},
    {from:"59타입", to:"84타입",  n:8},
    {from:"109타입", to:"84타입", n:5},
  ],
};
const CYCLE = {  // 3자 순환 제안 목데이터
  id: 1, size: 3,
  me:   {label:"나",           home:"101동 59A · 중층",  give:"59A"},
  recv: {dong:"103동", floorBand:"고층", type:"84A", dir:"남향",
         interior:"올수리 ('24)", extended:true, price:11.2e8, score:92,
         scoreDetail:[["위치",.95],["컨디션",.98],["가격",.82],["일정",.90]]},
  third:{label:"105동 중층 109A"},
  myAsk: 9.5e8,
  window:{from:"2026.10.15", to:"2026.11.30"},
};
const fmt = n => {
  const eok = Math.floor(n/1e8), man = Math.round((n%1e8)/1e4);
  return (eok? eok+"억":"") + (man? " "+man.toLocaleString()+"만":"") + "원";
};

/* ---------- store (localStorage) ---------- */
const S = {
  get(){ try{return JSON.parse(localStorage.getItem("djm")||"{}")}catch{return{}} },
  set(p){ localStorage.setItem("djm", JSON.stringify({...S.get(), ...p})); },
};
const defaults = {
  authed:false, dong:"", ho:"",
  photos:0, ask:"", moveFrom:"", moveTo:"", interior:"", occupancy:"",
  wDongs:[], types:[], budget:"", weights:["위치","컨디션","가격","일정"],
  homeState:"auto",           // 데모 스위처: auto | incomplete | waiting | proposed | dealing
  matchResp:"",               // "" | accepted | rejected
  deadline:0,
};
const st = () => ({...defaults, ...S.get()});

function completeness(){
  const s = st();
  const items = [
    ["사진 5장", s.photos>=5], ["희망 매도가", !!s.ask],
    ["이사 가능 기간", !!(s.moveFrom&&s.moveTo)], ["인테리어 상태", !!s.interior],
    ["점유 상태", !!s.occupancy], ["매수 희망 조건", s.types.length>0 && !!s.budget],
  ];
  const done = items.filter(i=>i[1]).length;
  return {pct: Math.round(done/items.length*100), missing: items.filter(i=>!i[1]).map(i=>i[0])};
}
function homeState(){
  const s = st();
  if(s.homeState!=="auto") return s.homeState;
  if(!s.authed) return "guest";
  if(completeness().pct<80) return "incomplete";
  if(s.matchResp==="accepted") return "dealing";
  return "proposed"; // 프로토타입: 완성되면 바로 제안 도착 시나리오
}

/* ---------- router ---------- */
const routes = {};
function go(h){ location.hash = h; }
window.addEventListener("hashchange", render);
function render(){
  const hash = location.hash.replace(/^#/,"") || "/";
  const [path] = hash.split("?");
  const seg = path.split("/").filter(Boolean);
  let view = routes["/"+ (seg[0]||"")];
  if(seg[0]==="profile") view = routes["/profile/"+seg[1]];
  if(seg[0]==="matches") view = () => Match(seg[1]);
  if(seg[0]==="deal")    view = () => Deal(seg[1]);
  document.getElementById("view").innerHTML = (view||routes["/"])();
  document.getElementById("view").scrollTop = 0;
  Tabbar(path); Demo();
  (postRender[path]||postRender[seg[0]]||(()=>{}))();
}
const postRender = {};

/* ---------- shared ui ---------- */
const appbar = (title, back) => `
  <div class="appbar">
    ${back?`<button class="back" onclick="history.back()">‹</button>`:""}
    <span class="title">${title}</span>
  </div>`;
function Tabbar(path){
  const authed = st().authed;
  const tabs = [
    ["#/home","🏠","홈"],["#/matches/1","💙","매칭"],["#/profile/my-home","🏢","내 집"],
    ["#/calculator","🧮","계산기"],["#/my","👤","마이"],
  ];
  document.getElementById("tabbar").innerHTML = authed ? tabs.map(([h,i,l])=>
    `<a href="${h}" class="${('#'+path).startsWith(h.split('/').slice(0,2).join('/'))?'on':''}">
       <span class="ico">${i}</span>${l}</a>`).join("") : "";
  document.getElementById("tabbar").style.display = authed ? "flex" : "none";
}
function Demo(){
  const s = st();
  document.getElementById("demo").innerHTML = s.authed ? `
    <select onchange="S.set({homeState:this.value});render()">
      ${["auto","incomplete","waiting","proposed","dealing"].map(v=>
        `<option ${s.homeState===v?"selected":""} value="${v}">demo:${v}</option>`).join("")}
    </select>` : "";
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

/* =====================================================================
   화면들
===================================================================== */

/* ----- 랜딩 ----- */
routes["/"] = () => st().authed ? (go("#/home"),"") : `
  <div class="hero">
    <div class="logo">단지매치</div>
    <h1>${COMPLEX.name} 갈아타기,<br>기다리지 말고 <span style="color:var(--brand)">맞바꾸세요</span></h1>
    <p class="sub" style="margin-top:10px">같은 단지 소유주끼리 순환거래로<br>매도와 매수를 한 번에, 같은 날.</p>
  </div>
  <div class="page">
    <div class="card">
      <h3>지금 우리 단지에서</h3>
      <div class="demand">
        ${COMPLEX.demand.map(d=>`
          <div class="demand-row"><span>${d.from} → ${d.to}</span><b>대기 ${d.n}명</b></div>`).join("")}
      </div>
    </div>
    <a class="btn" href="#/onboarding">내 매칭 가능성 확인하기</a>
    <div class="card howto">
      <h3>순환거래가 뭔가요?</h3>
      <div class="step"><span class="n">1</span><p><b>원하는 집을 등록하면</b>내 집을 원하는 이웃과 연결 고리를 찾아요.</p></div>
      <div class="step"><span class="n">2</span><p><b>사이클이 완성되면</b>A→B→C→A처럼 서로의 집을 동시에 사고팔아요.</p></div>
      <div class="step"><span class="n">3</span><p><b>같은 날 잔금·이사</b>일시적 2주택 걱정 없이 갈아타기가 끝나요.</p></div>
    </div>
    <a class="btn ghost" href="#/calculator">세금 계산기 무료로 써보기</a>
    <p class="sub" style="text-align:center;padding-bottom:20px">중개는 협력 공인중개사가 수행합니다</p>
  </div>`;

/* ----- 온보딩 ----- */
routes["/onboarding"] = () => {
  const s = st(); const step = s.obStep||1;
  const bar = `<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=step?'on':''}"></i>`).join("")}</div>`;
  const bodies = {
    1: `<h2>휴대폰 본인인증</h2>
        <p class="sub" style="margin:8px 0 24px">소유주 확인을 위해 본인 명의 휴대폰으로 인증해요.</p>
        <div class="field"><label>이름</label><input id="ob-name" placeholder="홍길동" value="${s.name||""}"></div>
        <div class="field"><label>휴대폰 번호</label><input id="ob-phone" inputmode="numeric" placeholder="010-0000-0000"></div>
        <button class="btn" onclick="obNext(1)">인증 요청 (프로토타입: 바로 통과)</button>`,
    2: `<h2>어느 집 소유주신가요?</h2>
        <p class="sub" style="margin:8px 0 24px">${COMPLEX.name} 기준으로 확인해요.</p>
        <div class="field"><label>동</label>
          <select id="ob-dong"><option value="">선택</option>
            ${COMPLEX.dongs.map(d=>`<option ${s.dong==d?"selected":""}>${d}</option>`).join("")}
          </select></div>
        <div class="field"><label>호수</label><input id="ob-ho" inputmode="numeric" placeholder="예: 1203" value="${s.ho||""}"></div>
        <button class="btn" onclick="obNext(2)">다음</button>`,
    3: `<div style="text-align:center;padding:40px 0">
          <div class="spinner"></div>
          <h2 style="margin-top:24px">등기부를 확인하고 있어요</h2>
          <p class="sub" style="margin-top:8px">${s.dong}동 ${s.ho}호의 소유자 정보와<br>본인인증 정보를 대조합니다 (수 초 소요)</p>
        </div>`,
    4: `<div style="text-align:center;padding:24px 0">
          <div class="check-big">✓</div>
          <h2 style="margin-top:20px">소유주 인증 완료!</h2>
          <p class="sub" style="margin:10px 0 28px">${COMPLEX.name} ${s.dong}동 ${s.ho}호<br>이제 프로필을 등록하면 매칭이 시작돼요.</p>
          <button class="btn" onclick="S.set({authed:true});go('#/profile/my-home')">내 집 프로필 등록하기</button>

postRender["matches"] = () => {
  let dl = st().deadline;
  if(!dl || dl < Date.now()){ dl = Date.now()+47*3600e3+12*60e3+9e3; S.set({deadline:dl}); }
  const el = document.getElementById("cd"); if(!el) return;
  const tick = () => {
    const el2 = document.getElementById("cd"); if(!el2) return clearInterval(iv);
    let ms = Math.max(0, st().deadline-Date.now());
    const h = String(Math.floor(ms/3600e3)).padStart(2,"0"),
          m = String(Math.floor(ms%3600e3/60e3)).padStart(2,"0"),
          sec = String(Math.floor(ms%60e3/1e3)).padStart(2,"0");
    el2.textContent = `${h}:${m}:${sec}`;
  };
  tick(); const iv = setInterval(tick, 1000);
};

function calcAcq(){
  const p = parseFloat(document.getElementById("c-price").value)*1e8;
  if(!p) return toast("취득가액을 입력해 주세요");
  const cnt = st().cCnt||0;
  let rate;
  if(cnt>=2) rate = .12;
  else if(cnt===1) rate = .08;
  else if(p<=6e8) rate = .01;
  else if(p<=9e8) rate = (p/1e8*2/3-3)/100;
  else rate = .03;
  const tax = p*rate, extra = p*.001+p*(rate===.01?.001:.003)*0; // 지방교육세 간략화
  S.set({cPrice:p/1e8, cResult:`
    <div class="divider" style="margin:16px 0"></div>
    <table class="money-table">
      <tr><td>적용 세율</td><td>${(rate*100).toFixed(2)}%</td></tr>
      <tr><td>취득세</td><td>${fmt(Math.round(tax))}</td></tr>
      <tr><td>지방교육세 (약)</td><td>${fmt(Math.round(p*.001))}</td></tr>
      <tr class="total"><td>합계 (약)</td><td class="plus">${fmt(Math.round(tax+p*.001))}</td></tr>
    </table>`});
  render();
}
